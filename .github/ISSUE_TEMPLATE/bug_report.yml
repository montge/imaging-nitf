name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Parse file '...'
        2. Call method '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: sample-file
    attributes:
      label: Sample NITF File
      description: If applicable, provide a link or description of the NITF file causing issues
      placeholder: Can you share the NITF file or describe its characteristics?

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of imaging-nitf are you using?
      options:
        - 0.11-SNAPSHOT (latest)
        - 0.10
        - 0.9
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: java-version
    attributes:
      label: Java Version
      description: What Java version are you using?
      options:
        - JDK 21
        - JDK 17
        - JDK 11
        - JDK 8 or earlier
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      options:
        - Linux
        - Windows
        - macOS
        - Other (specify in additional context)
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack Trace
      description: If applicable, add the stack trace
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all required information above
          required: true
        - label: I have tested with the latest version
          required: false
