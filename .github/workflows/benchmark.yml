name: Performance Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run JMH Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project
        run: ./mvnw clean install -DskipTests

      - name: Run benchmarks (if available)
        id: benchmark
        run: |
          # Check if JMH benchmarks exist
          if [ -d "benchmarks" ] || grep -q "jmh" pom.xml; then
            echo "Running JMH benchmarks..."
            ./mvnw jmh:run -pl benchmarks 2>&1 | tee benchmark-results.txt || echo "No benchmarks found"
          else
            echo "No JMH benchmarks configured yet."
            echo "To add benchmarks, add the JMH Maven plugin and create benchmark classes."
          fi
        continue-on-error: true

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: Java Benchmark
          tool: 'jmh'
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          fail-on-alert: false
          alert-threshold: '150%'
          comment-always: false
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30
        continue-on-error: true

      - name: Comment PR with benchmark comparison
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('benchmark-results.txt')) {
              const results = fs.readFileSync('benchmark-results.txt', 'utf8');
              const body = `## 📊 Benchmark Results\n\n\`\`\`\n${results.slice(0, 2000)}\n\`\`\`\n\n_Full results available in workflow artifacts_`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
        continue-on-error: true
