name: OWASP Dependency Check

on:
  schedule:
    - cron: '0 2 * * 1'  # Run every Monday at 2 AM UTC
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  dependency-check:
    name: OWASP Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Cache OWASP Dependency-Check data
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: ${{ runner.os }}-owasp-data-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-owasp-data-

    - name: Run OWASP Dependency-Check
      run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

    - name: Upload Dependency-Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: |
          **/target/dependency-check-report.html
          **/target/dependency-check-report.json
        retention-days: 30

    - name: Publish Results Summary
      if: always()
      run: |
        echo "## OWASP Dependency Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f target/dependency-check-report.json ]; then
          echo "✅ Dependency check completed. See artifacts for detailed report." >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Dependency check report not found." >> $GITHUB_STEP_SUMMARY
        fi
