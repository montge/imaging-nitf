name: Multi-JDK Matrix Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 3 * * 1'  # Run every Monday at 3 AM UTC

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS

jobs:
  build:
    name: Build on ${{ matrix.os }} with JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [11, 17, 21]
        exclude:
          # Reduce matrix for Windows and macOS to save CI time
          - os: windows-latest
            java: 17
          - os: macos-latest
            java: 17

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 100

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-jdk${{ matrix.java }}-
          ${{ runner.os }}-m2-

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4
      with:
        maven-version: 3.9.9

    - name: Build with Maven
      run: mvn -B -U clean install -Dfmt.skip=true

    - name: Run Tests
      run: mvn -B test

    - name: Generate Coverage Report (JDK 11 only)
      if: matrix.java == 11 && matrix.os == 'ubuntu-latest'
      run: mvn jacoco:report

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-jdk${{ matrix.java }}
        path: |
          **/target/surefire-reports/*.xml
          **/target/failsafe-reports/*.xml
        retention-days: 7

    - name: Publish Test Summary
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results (${{ matrix.os }}, JDK ${{ matrix.java }})
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false
